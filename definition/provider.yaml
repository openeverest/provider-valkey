# Provider identity and component definitions.
# Component types define what software each component runs (e.g. mongod, backup).
# Component names are the logical roles used in topologies (e.g. engine, proxy).
#
# Run `provider-sdk add component` to add components interactively.
# For more details, see github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md.

name: valkey

# Components map logical component names to their type.
# The type must match a key in versions.yaml's componentTypes.
components:
  # engine runs the Valkey server and backs the ValkeyCluster resource.
  engine:
    type: valkey
    parametersSchema: ValkeyEngineConfig
  # monitoring runs the metrics exporter sidecar on each engine pod for a
  # Prometheus the user runs. The exporter also runs, without the component,
  # while a monitoring destination of the Instance needs metrics. Its
  # parameters are deprecated and ignored.
  monitoring:
    type: exporter
    parametersSchema: MonitoringParameters

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes.
# Version catalogs stay in versions.yaml.
componentTypes:
  valkey:
    kind: valkey
