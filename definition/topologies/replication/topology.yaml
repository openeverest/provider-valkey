# Replication topology definition.
# This file defines both the structural topology and its UI rendering.
#
# config.components: Which components are used and their defaults.
# config.configSchema: Reference a Go type for custom topology config fields.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
  components:
    engine:
      defaults:
        replicas: 1
      supportedFields:
        properties:
          storage: {}
          resources: {}
          # Replicas of the single primary; 0 runs the primary alone.
          replicas: {minimum: 0}
          # The operator has no schedulerName.
          schedulingPolicy:
            properties:
              affinity: {}
              nodeSelector: {}
              tolerations: {}
              topologySpreadConstraints: {}
    monitoring:
      optional: true
      # The exporter is a sidecar in the engine pods, which place it.
      supportedFields:
        properties:
          resources: {}
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Provide the basic information for your new database.
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: Database Version
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: name
              valuePath: name
            modes:
              edit:
                disabled: true
          validation:
            required: true
    resources:
      label: Resources
      description: Configure the replicas and resources for your database.
      components:
        numberOfReplicas:
          uiType: number
          path: spec.components.engine.replicas
          fieldParams:
            label: Number of replicas
            defaultValue: 1
            step: 1
          validation:
            required: true
            int: true
            min: 0
            max: 10
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: quantity
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: CPU
                defaultValue: 1
                unitLabel: CPU
              validation:
                required: true
                min: 0.1
            memory:
              uiType: quantity
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: Memory
                defaultValue: 2
                step: 0.1
                unit: Gi
              validation:
                required: true
                min: 0.128
            disk:
              uiType: quantity
              path: spec.components.engine.storage.size
              fieldParams:
                label: Disk
                defaultValue: 10
                unit: Gi
              validation:
                required: true
                int: true
                min: 1
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "double(spec.components.engine.storage.size) >= double(original.spec.components.engine.storage.size)"
                        message: Disk size cannot be decreased
          componentsOrder:
            - cpu
            - memory
            - disk
      componentsOrder:
        - numberOfReplicas
        - resources
    advanced:
      label: Advanced configuration
      description: Configure advanced settings for your database.
      components:
        storageClass:
          uiType: select
          path: spec.components.engine.storage.storageClass
          dataSource:
            provider: storageClasses
          fieldParams:
            label: Storage class
            modes:
              edit:
                disabled: true
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.mode
          fieldParams:
            label: TLS - transport encryption
            defaultValue: enabled
            options:
              - label: Enabled
                value: enabled
              - label: Disabled
                value: disabled
            modes:
              edit:
                disabled: true
        clientAuth:
          uiType: select
          path: spec.components.engine.parameters.tls.clientAuth
          fieldParams:
            label: Client certificate authentication (mTLS)
            defaultValue: optional
            options:
              - label: Optional
                value: optional
              - label: Required
                value: required
              - label: Disabled
                value: disabled
        certificateUser:
          uiType: select
          path: spec.components.engine.parameters.tls.certificateUser
          fieldParams:
            label: Log in with the client certificate
            defaultValue: disabled
            options:
              - label: Disabled
                value: disabled
              - label: Certificate Common Name
                value: cn
      componentsOrder:
        - storageClass
        - tls
        - clientAuth
        - certificateUser
    monitoring:
      label: Metrics exporter
      description: >-
        Expose Valkey metrics in the Prometheus format for a monitoring system you run.
        To send metrics to an OpenEverest monitoring destination, add the destination
        under Monitoring instead: it runs the exporter on its own.
      components:
        metrics:
          uiType: group
          groupType: toggleable
          label: Expose metrics
          description: Run a metrics exporter next to every Valkey server, on the port named metrics at /metrics.
          # Any value in the group adds the monitoring component.
          components:
            exporterResources:
              uiType: group
              groupType: line
              components:
                cpu:
                  uiType: quantity
                  path: spec.components.monitoring.resources.limits.cpu
                  fieldParams:
                    label: Exporter CPU
                    defaultValue: 100
                    step: 50
                    unit: m
                    unitLabel: mCPU
                  validation:
                    required: true
                    int: true
                    min: 10
                memory:
                  uiType: quantity
                  path: spec.components.monitoring.resources.limits.memory
                  fieldParams:
                    label: Exporter memory
                    defaultValue: 128
                    step: 32
                    unit: Mi
                  validation:
                    required: true
                    int: true
                    min: 32
              componentsOrder:
                - cpu
                - memory
          componentsOrder:
            - exporterResources
      componentsOrder:
        - metrics
  sectionsOrder:
    - basicInfo
    - resources
    - advanced
    - monitoring
