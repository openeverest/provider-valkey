name: Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: make k3d-cluster-up

      - name: Install prerequisites
        run: |
          # Install the OpenEverest CRDs, the bundled ValkeyCluster CRD, and the
          # Provider CR. The integration tests simulate the valkey-operator by
          # patching ValkeyCluster status, so the operator is not deployed.
          make install-test-crds
          make install-provider-cr

      - name: Install chainsaw
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          VERSION="0.2.15"
          curl -fsSL -o /tmp/chainsaw.tar.gz "https://github.com/kyverno/chainsaw/releases/download/v${VERSION}/chainsaw_linux_${ARCH}.tar.gz"
          tar -xzf /tmp/chainsaw.tar.gz -C /usr/local/bin chainsaw
          chmod +x /usr/local/bin/chainsaw
          chainsaw version

      - name: Build provider
        run: make build

      - name: Run provider in background
        run: |
          ./bin/provider > /tmp/provider.log 2>&1 &
          echo "Waiting for the provider to become ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8082/readyz >/dev/null 2>&1; then
              echo "Provider ready after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Provider did not become ready in time"
          cat /tmp/provider.log || true
          exit 1

      - name: Run integration tests
        run: make test-integration

      - name: Print provider logs on failure
        if: failure()
        run: |
          echo "===== provider.log ====="
          cat /tmp/provider.log || true

      - name: Upload chainsaw report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chainsaw-report-${{ github.run_id }}
          path: /tmp/chainsaw-report*.xml
          retention-days: 7

      - name: Cleanup
        if: always()
        run: make k3d-cluster-down
