# Nothing needs the exporter any more: it stops and its endpoint goes.
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: test-valkey-monitoring
spec:
  exporter:
    enabled: false
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-valkey-monitoring
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
  (conditions[?type == 'Available'].status | [0]): "True"
  # Without destinations the monitoring conditions are removed.
  (conditions[?type == 'MonitoringConfigured'] | length(@)): 0
  (monitoring.destinations == null): true
  (monitoring.sources.metrics == null): true
