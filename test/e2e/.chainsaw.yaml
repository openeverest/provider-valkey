---
# Suites run against the provider installed from its chart, with the
# valkey-operator and the OpenEverest controller: real pods, so the
# timeouts are longer than the integration suites'.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: e2e
spec:
  timeouts:
    apply: 30s
    assert: 5m
    delete: 2m
    error: 1m
    exec: 2m
    cleanup: 2m
  cleanup:
    skipDelete: false
  report:
    format: XML
    name: chainsaw-report
    path: /tmp
