# The provider must create a PodMonitor that scrapes the exporter sidecars of
# the instance's pods, labelled so that plugin-metrics can find it.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: test-valkey-metrics-metrics
  labels:
    app.kubernetes.io/managed-by: everest
    app.kubernetes.io/instance: test-valkey-metrics
spec:
  selector:
    matchLabels:
      valkey.io/cluster: test-valkey-metrics
  podTargetLabels:
    - valkey.io/shard-index
    - valkey.io/node-index
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - action: replace
          targetLabel: core_openeverest_io_component
          replacement: engine
