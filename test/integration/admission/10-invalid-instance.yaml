# Logging clients in by their certificate needs transport encryption.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-valkey-admission
spec:
  providerRef:
    name: valkey
  topology:
    type: replication
  components:
    engine:
      type: valkey
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
      parameters:
        tls:
          mode: disabled
          certificateUser: cn
