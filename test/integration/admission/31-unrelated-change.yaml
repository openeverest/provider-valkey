# Changes the CPU limit and keeps only the error the stored Instance has.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-valkey-admission
spec:
  providerRef:
    name: valkey
  topology:
    type: replication
  parameters:
    tls:
      mode: disabled
      certificateUser: cn
  components:
    engine:
      type: valkey
      replicas: 1
      resources:
        limits:
          cpu: "2"
          memory: 1Gi
      storage:
        size: 1Gi
