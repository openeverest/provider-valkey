# A valid Instance naming a user Secret that does not exist yet.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-valkey-nosecret
spec:
  providerRef:
    name: valkey
  userSecretRef:
    name: test-admission-missing-users
  topology:
    type: replication
  components:
    engine:
      type: valkey
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
