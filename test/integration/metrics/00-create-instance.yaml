# A replication Instance scraped by both Prometheus and VictoriaMetrics.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-valkey-metrics
spec:
  providerRef:
    name: valkey
  topology:
    type: replication
  components:
    engine:
      type: valkey
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
    monitoring:
      type: exporter
      parameters:
        metrics:
          prometheus:
            enabled: true
          victoriaMetrics:
            enabled: true
