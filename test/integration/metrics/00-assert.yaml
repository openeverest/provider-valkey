# The monitoring component runs the exporter sidecar of the version bundle,
# with its resources.
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: test-valkey-metrics
spec:
  exporter:
    enabled: true
    image: oliver006/redis_exporter:v1.80.0
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
