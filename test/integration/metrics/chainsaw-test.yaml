---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: metrics
spec:
  description: |
    The metrics exporter and the scrape resources of earlier releases: an
    Instance with the monitoring component, carrying the deprecated scrape
    parameters earlier UIs wrote, runs the exporter sidecar. The provider
    deletes the PodMonitors and VMPodScrapes earlier releases created and
    creates none. Removing the component, with no monitoring destination
    listed, stops the exporter. The published sources and the monitoring
    destinations are covered by the e2e monitoring suite.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instances.core.openeverest.io,valkeycluster,podmonitor,vmpodscrape -o yaml
  steps:
    - name: exporter-and-legacy-scrapes
      try:
        - apply:
            file: 00-legacy-scrapes.yaml
        - apply:
            file: 00-create-instance.yaml
        - assert:
            file: 00-assert.yaml
        - error:
            file: 00-errors.yaml

    - name: remove-monitoring
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE patch instances.core.openeverest.io/test-valkey-metrics --type=json \
                -p '[{"op":"remove","path":"/spec/components/monitoring"}]'
        - assert:
            file: 10-assert.yaml
