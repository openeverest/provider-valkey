# The PodMonitor earlier provider versions created for every instance with the
# monitoring component.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: test-valkey-metrics-metrics
spec:
  selector:
    matchLabels:
      valkey.io/cluster: test-valkey-metrics
  podMetricsEndpoints:
    - port: metrics
