---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: replication
spec:
  description: |
    Lifecycle of a replication (single-shard) Valkey Instance: create it, verify
    the provider derives a ValkeyCluster with one shard, simulate the operator
    marking the cluster ready, verify the Instance reaches Ready, and verify the
    ValkeyCluster is garbage collected on deletion.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,valkeycluster,valkeynode -o yaml
  steps:
    - name: create-cluster
      try:
        - apply:
            file: 00-create-cluster.yaml
        - assert:
            file: 00-assert.yaml

    # Simulate the valkey-operator: its ValkeyNodes report their role and
    # readiness, and it reports the cluster healthy for the latest generation
    # with every hash slot assigned. The provider reports the Instance ready
    # and available from these.
    - name: cluster-ready
      try:
        - apply:
            file: 10-valkey-nodes.yaml
        - script:
            content: |
              set -eu
              for node in test-valkey-replication-0-0:primary test-valkey-replication-0-1:replica; do
                gen=$(kubectl -n $NAMESPACE get valkeynode/${node%:*} -o jsonpath='{.metadata.generation}')
                kubectl -n $NAMESPACE patch valkeynode/${node%:*} --subresource status --type=merge \
                  -p "{\"status\":{\"observedGeneration\":$gen,\"ready\":true,\"role\":\"${node#*:}\"}}"
              done
              gen=$(kubectl -n $NAMESPACE get valkeycluster/test-valkey-replication -o jsonpath='{.metadata.generation}')
              now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              cond() {
                printf '{"type":"%s","status":"True","reason":"%s","message":"%s","observedGeneration":%s,"lastTransitionTime":"%s"}' \
                  "$1" "$2" "$3" "$gen" "$now"
              }
              kubectl -n $NAMESPACE patch valkeycluster/test-valkey-replication --subresource status --type=merge \
                -p "{\"status\":{\"state\":\"Ready\",\"shards\":1,\"readyShards\":1,\"conditions\":[$(cond Ready ClusterHealthy 'Cluster is healthy'),$(cond SlotsAssigned AllSlotsAssigned 'All slots assigned')]}}"
        - assert:
            file: 10-assert.yaml

    - name: delete-cluster
      try:
        - script:
            content: kubectl -n $NAMESPACE delete instance/test-valkey-replication --wait=false
        - error:
            file: 20-errors.yaml
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-valkey-replication
            for:
              deletion: {}
