# The provider must reconcile the Instance into a ValkeyCluster with a single
# shard (replication topology) and one replica per shard.
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: test-valkey-replication
spec:
  image: valkey/valkey:9.0.6
  shards: 1
  replicas: 1
  exporter:
    enabled: true
  scheduling:
    node:
      spread:
        shard:
          mode: Required
  users:
    - name: default
      enabled: true
      permissions: "+@all ~* &*"
      passwordSecret:
        name: test-valkey-replication-auth
        keys:
          - default
---
# Clients connect through the primary Service. No ValkeyNode reports a role
# yet, so it selects the operator's initial primary.
apiVersion: v1
kind: Service
metadata:
  name: valkey-test-valkey-replication-primary
spec:
  type: ClusterIP
  selector:
    valkey.io/cluster: test-valkey-replication
    valkey.io/shard-index: "0"
    valkey.io/node-index: "0"
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
