# The provider must reconcile the Instance into a ValkeyCluster with the number
# of shards requested by the cluster topology (numShards: 3).
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: test-valkey-cluster
spec:
  image: valkey/valkey:9.0.6
  shards: 3
  replicasPerShard: 1
  # valkey-operator rejects the deprecated field alongside its replacement.
  (replicas == null): true
  exporter:
    enabled: true
  scheduling:
    node:
      spread:
        shard:
          mode: Required
  podMetadata:
    labels:
      core.openeverest.io/provider: valkey
      core.openeverest.io/instance: test-valkey-cluster
      core.openeverest.io/component: engine
  networking:
    discovery:
      preferredEndpointType: Hostname
    tls:
      certificates:
        server:
          secretName: test-valkey-cluster-tls
  (users == null): true
  acl:
    users:
      - name: default
        state: Enabled
        permissions: "+@all ~* &*"
        password:
          type: Secret
          secret:
            name: test-valkey-cluster-auth
            keys:
              - default
